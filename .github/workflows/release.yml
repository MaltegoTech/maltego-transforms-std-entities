name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish-target:
        description: Publish target for manual runs
        type: choice
        required: true
        default: testpypi
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry==2.1.4

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Test with coverage
        run: poetry run pytest --cov=src/maltego --cov-report=term-missing

      - name: Build wheel + sdist
        run: poetry build

      - name: Install SBOM generator
        run: python -m pip install 'cyclonedx-bom>=7.3,<8'

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p dist/sbom
          poetry run python resources/generate_sbom.py --output dist/sbom/maltego-transforms-std-entities-sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: |
            dist/*.whl
            dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sbom
          path: dist/sbom/maltego-transforms-std-entities-sbom.cdx.json

      - name: Attach wheel + sdist + SBOM to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.whl dist/*.tar.gz dist/sbom/maltego-transforms-std-entities-sbom.cdx.json --clobber

  publish-testpypi:
    runs-on: ubuntu-latest
    needs:
      - build
    if: github.event_name == 'workflow_dispatch' && inputs.publish-target == 'testpypi'
    permissions:
      id-token: write
    environment:
      name: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Publish release distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    runs-on: ubuntu-latest
    needs:
      - build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish-target == 'pypi')
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
